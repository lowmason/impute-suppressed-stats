[project]
name = "logging-employment"
version = "0.1.0"
description = "Monthly state Logging (NAICS 113310) employment by establishment size class"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Lowell Mason", email = "mason.lowell@mac.com" }]
dependencies = [
    "httpx>=0.28",
    "polars>=1.44",
    "pyarrow>=25.0",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "typer>=0.27",
]

[project.scripts]
logging-estimates = "logging_employment.cli:app"

[dependency-groups]
dev = [
    "black>=25.0",
    "interrogate>=1.7",
    "pytest>=8.0",
    "python-dotenv>=1.2",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logging_employment"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits a live source endpoint; excluded from the default run",
    "slow: takes more than a few seconds",
]

[tool.interrogate]
fail-under = 100
exclude = ["tests"]
